
<!DOCTYPE html>
<html amp lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1" />
  <title>###title#</title>
  <meta name="description" content="###desc#" />
  <meta name="robots" content="index,follow" />
  <link href="###icon#" rel="shortcut icon" type="image/x-icon" />
  <link rel="canonical" href="###domlp#" />
  <meta property="og:url" content="###domlp#" />
  <meta property="og:site_name" content="###brand#" />
  <meta property="og:image:alt" content="###brand#" />
  <meta property="og:image" content="###banner#" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="script" href="https://cdn.ampproject.org/v0.js" />
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  <style amp-boilerplate>
    body { -webkit-animation: -amp-start 8s steps(1, end) 0s 1 normal both; -moz-animation: -amp-start 8s steps(1, end) 0s 1 normal both; -ms-animation: -amp-start 8s steps(1, end) 0s 1 normal both; animation: -amp-start 8s steps(1, end) 0s 1 normal both }
    @-webkit-keyframes -amp-start { from { visibility: hidden } to { visibility: visible } }
    @-moz-keyframes -amp-start { from { visibility: hidden } to { visibility: visible } }
    @-ms-keyframes -amp-start { from { visibility: hidden } to { visibility: visible } }
    @-o-keyframes -amp-start { from { visibility: hidden } to { visibility: visible } }
    @keyframes -amp-start { from { visibility: hidden } to { visibility: visible } }
  </style>
  <noscript>
    <style amp-boilerplate>
      body { -webkit-animation: none; -moz-animation: none; -ms-animation: none; animation: none }
    </style>
  </noscript>

  <style amp-custom>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary: gold;
      --primary-dark: gold;
      --secondary: rgb(255, 187, 0); 
      --bg-dark: #050505;
      --card-bg: rgba(20, 20, 20, 0.85);
      --text: #ffffff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-image: url(###banner#);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      background: rgb(12 12 12 / 71%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 25px 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    header {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo {
      filter: drop-shadow(0 0 15px rgba(97, 66, 0, 0.4));
      transition: transform 0.3s ease;
    }
    .logo:hover { transform: scale(1.05); }

    .title-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge-top {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: #ff0000;
      border: 1px solid rgba(252 255 0);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .title-wrap h1 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      background: -webkit-linear-gradient(#fff, #ccc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-wrap p {
      font-size: 12px;
      color: #aaa;
      font-weight: 300;
    }

    .welcome {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
      text-align: center;
      border-left: 3px solid #ff0000;
    }

    .welcome h3 {
      font-size: 12px;
      color: #fff;
      font-family: 'Courier New', Courier, monospace; 
      overflow: hidden;
      border-right: .15em solid #ff0000;
      white-space: nowrap;
      margin: 0 auto;
      width: fit-content;
      animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
    }

    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #ff0000; } }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 50px;
      text-decoration: none;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      position: relative;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #fffb00 0%, #ffae00 100%);
      color: #000000;
      box-shadow: 0 4px 15px rgba(230, 157, 0, 0.4);
      animation: pulse 2s infinite;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: greenyellow;
      border: 1px solid green;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      font-size: 12px;
      padding: 10px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 238, 0, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(230, 0, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 0, 0, 0); }
    }


    .hero {
      margin: 20px 0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .table-wrapper {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      overflow: hidden;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      background: linear-gradient(90deg, #ff0000, #ff0000);
      color: #000000;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    td {
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }
    
    tr:last-child td { border-bottom: none; }

    td:first-child {
      font-weight: 600;
      font-size: 13px;
      color: #ddd;
    }

    .btn-mini {
      display: inline-block;
      padding: 6px 15px;
      background: #000001;
      color: #ff0000;
      font-weight: 700;
      font-size: 11px;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 2px 5px rgb(255, 0, 0);
    }

    .copyright {
      margin-top: 25px;
      text-align: center;
      font-size: 11px;
      color: #ffffff;
    }
    .copyright a { color: #1eff00; text-decoration: none; }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <header>
          <amp-img
            class="logo"
            src="###logo#"
            alt="Logo ###brand#"
            width="200"
            height="55"
            layout="intrinsic">
          </amp-img>
      </header>

      <div class="title-wrap">

        <h1>###title#</h1>
        
      </div>

      <div class="welcome">
        <h3>###brand# Baik | ###brand# Online | Situs ###brand#</h3>
      </div>

      <a href="###login#" target="_blank" rel="noreferrer noopener" class="btn btn-primary">
        ⭐ DAFTAR ###brand# ⭐
      </a>
      
      <a href="###login#" target="_blank" rel="noreferrer noopener" class="btn btn-secondary">
        ✅ LOGIN ###brand# ✅
      </a>

      <div class="hero">
        <amp-img
          src="###banner#"
          width="600"
          height="600"
          layout="responsive"
          alt="###title#">
        </amp-img>
      </div>

    

      <p class="copyright">
        Copyright © 2026 • <a href="###domlp#">###brand#</a>
      </p>
    </div>
  </div>
</body>
</html>
